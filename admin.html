<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>만종감리교회 - 목사님 관리자</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f5ef;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
  font-size: 20px;
  line-height: 1.7;
}

header {
  background: #5d6f52;
  color: white;
  text-align: center;
  padding: 35px 20px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 5px 0 0;
  font-size: 18px;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 30px 18px 60px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  font-size: 28px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: 700;
}

input,
select,
textarea {
  width: 100%;
  padding: 15px;
  border: 1px solid #bbb;
  border-radius: 10px;
  font-size: 19px;
  font-family: inherit;
}

textarea {
  min-height: 280px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 10px;
  padding: 14px 22px;
  font-size: 19px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  margin-top: 20px;
  background: #5d6f52;
  color: white;
}

.secondary {
  margin-top: 12px;
  background: #e5e8e1;
  color: #333;
}

.error {
  color: #b13b32;
  white-space: pre-wrap;
  word-break: break-word;
}

.success {
  color: #4d6943;
  font-weight: 700;
}

.hidden {
  display: none;
}

.small {
  color: #777;
  font-size: 15px;
}
</style>

</head>


<body>


<header>

  <h1>만종감리교회</h1>

  <p>목사님 관리자</p>

</header>


<main class="container">


<!-- 로그인 -->

<section id="loginCard" class="card">

  <h2>관리자 로그인</h2>


  <label for="email">
    이메일
  </label>

  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="관리자 이메일"
  >


  <label for="password">
    비밀번호
  </label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="비밀번호"
  >


  <button
    id="loginBtn"
    class="primary"
  >
    로그인
  </button>


  <p
    id="loginMsg"
    class="error"
  ></p>

</section>



<!-- 관리자 화면 -->

<section
  id="adminCard"
  class="card hidden"
>

  <h2>목사님 설명 입력</h2>


  <label for="chapter">
    창세기 장
  </label>

  <select id="chapter"></select>


  <label for="text">
    목사님 설명
  </label>

  <textarea
    id="text"
    placeholder="선택한 장에 대한 목사님 설명을 입력해 주세요."
  ></textarea>


  <button
    id="saveBtn"
    class="primary"
  >
    저장하기
  </button>


  <button
    id="logoutBtn"
    class="secondary"
  >
    로그아웃
  </button>


  <p id="status"></p>


  <p class="small">
    저장된 설명은 성도님용 '오늘의 창세기' 페이지에서
    해당 장을 선택하면 표시됩니다.
  </p>

</section>


</main>



<script type="module">


/* =====================================================
   Firebase SDK
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



/* =====================================================
   Firebase 설정
===================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyCSDusP0m2Mbg2wNg7r6duA_T5stDH7YKU",

  authDomain: "manjong-genesis.firebaseapp.com",

  projectId: "manjong-genesis",

  storageBucket: "manjong-genesis.firebasestorage.app",

  messagingSenderId: "1017583422703",

  appId: "1:1017583422703:web:6c7d1ebec3850a8b92df1a"

};



/* =====================================================
   Firebase 초기화
===================================================== */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);



/* =====================================================
   화면 요소
===================================================== */

const loginCard =
  document.getElementById("loginCard");


const adminCard =
  document.getElementById("adminCard");


const email =
  document.getElementById("email");


const password =
  document.getElementById("password");


const loginBtn =
  document.getElementById("loginBtn");


const loginMsg =
  document.getElementById("loginMsg");


const chapter =
  document.getElementById("chapter");


const text =
  document.getElementById("text");


const saveBtn =
  document.getElementById("saveBtn");


const logoutBtn =
  document.getElementById("logoutBtn");


const status =
  document.getElementById("status");



/* =====================================================
   창세기 1~50장 선택 목록
===================================================== */

for (
  let i = 1;
  i <= 50;
  i++
) {

  const option =
    document.createElement("option");

  option.value = String(i);

  option.textContent =
    "창세기 " + i + "장";

  chapter.appendChild(option);

}



/* =====================================================
   목사님 설명 불러오기
===================================================== */

async function loadText() {

  try {

    const chapterNumber =
      chapter.value;


    const reference =
      doc(
        db,
        "pastorExplanations",
        chapterNumber
      );


    const snap =
      await getDoc(reference);


    if (snap.exists()) {

      text.value =
        snap.data().text || "";

    } else {

      text.value = "";

    }


    status.textContent = "";

    status.className = "";

  }

  catch (error) {

    status.className =
      "error";

    status.textContent =
      "설명을 불러오지 못했습니다.\n\n"
      + error.code
      + "\n"
      + error.message;

  }

}



/* =====================================================
   장 선택
===================================================== */

chapter.addEventListener(
  "change",
  loadText
);



/* =====================================================
   로그인
===================================================== */

loginBtn.addEventListener(
  "click",
  async function () {

    loginMsg.textContent = "";

    const emailValue =
      email.value.trim();

    const passwordValue =
      password.value;


    if (!emailValue) {

      loginMsg.textContent =
        "이메일을 입력해 주세요.";

      return;

    }


    if (!passwordValue) {

      loginMsg.textContent =
        "비밀번호를 입력해 주세요.";

      return;

    }


    try {

      await signInWithEmailAndPassword(
        auth,
        emailValue,
        passwordValue
      );

    }

    catch (error) {

      loginMsg.textContent =
        "로그인 실패\n\n"
        + error.code
        + "\n"
        + error.message;

      console.error(
        "Firebase 로그인 오류:",
        error
      );

    }

  }
);



/* =====================================================
   설명 저장
===================================================== */

saveBtn.addEventListener(
  "click",
  async function () {

    const chapterNumber =
      chapter.value;

    const explanation =
      text.value.trim();


    if (!explanation) {

      status.className =
        "error";

      status.textContent =
        "설명을 입력해 주세요.";

      return;

    }


    try {

      await setDoc(

        doc(
          db,
          "pastorExplanations",
          chapterNumber
        ),

        {
          text: explanation,
          updatedAt: serverTimestamp()
        }

      );


      status.className =
        "success";

      status.textContent =
        "창세기 "
        + chapterNumber
        + "장 설명이 저장되었습니다.";

    }

    catch (error) {

      status.className =
        "error";

      status.textContent =
        "저장하지 못했습니다.\n\n"
        + error.code
        + "\n"
        + error.message;

      console.error(
        "Firestore 저장 오류:",
        error
      );

    }

  }
);



/* =====================================================
   로그아웃
===================================================== */

logoutBtn.addEventListener(
  "click",
  async function () {

    await signOut(auth);

  }
);



/* =====================================================
   로그인 상태 확인
===================================================== */

onAuthStateChanged(
  auth,
  async function (user) {

    if (user) {

      loginCard
        .classList
        .add("hidden");


      adminCard
        .classList
        .remove("hidden");


      await loadText();

    }

    else {

      loginCard
        .classList
        .remove("hidden");


      adminCard
        .classList
        .add("hidden");

    }

  }
);


</script>


</body>

</html>
