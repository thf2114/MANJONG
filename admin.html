<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
  만종감리교회 - 관리자
</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f7f5ef;

  color: #222;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;

  font-size: 23px;

  line-height: 1.7;

}


header {

  background: #5d6f52;

  color: white;

  text-align: center;

  padding: 30px 20px;

}


header h1 {

  margin: 0;

  font-size: 34px;

  line-height: 1.4;

}


.container {

  max-width: 800px;

  margin: auto;

  padding: 30px 20px 60px;

}


.card {

  background: white;

  border-radius: 18px;

  padding: 30px;

  box-shadow: 0 2px 10px #0001;

}


label {

  display: block;

  font-size: 25px;

  font-weight: 900;

  margin:

    20px 0 10px;

}


select {

  width: 100%;

  padding: 16px;

  border:

    2px solid #bbb;

  border-radius: 12px;

  font-size: 23px;

  background: white;

}


textarea {

  width: 100%;

  min-height: 300px;

  padding: 18px;

  border:

    2px solid #bbb;

  border-radius: 12px;

  font-size: 23px;

  line-height: 1.8;

  font-family: inherit;

  resize: vertical;

}


button {

  border: none;

  border-radius: 12px;

  padding: 17px 25px;

  font-size: 23px;

  font-weight: 900;

  cursor: pointer;

}


.save-btn {

  width: 100%;

  margin-top: 25px;

  background: #5d6f52;

  color: white;

}


.status {

  margin-top: 18px;

  font-size: 22px;

  font-weight: 800;

}


.success {

  color: #49623f;

}


.error {

  color: #a33;

  white-space: pre-wrap;

}


.hint {

  font-size: 19px;

  color: #777;

  margin-top: 7px;

}


@media (max-width: 600px) {

  body {
    font-size: 21px;
  }

  header h1 {
    font-size: 30px;
  }

  .container {
    padding: 20px 14px;
  }

  .card {
    padding: 22px;
  }

  label {
    font-size: 23px;
  }

  select,
  textarea {
    font-size: 21px;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    만종감리교회<br>
    목사님 관리자
  </h1>

</header>



<main class="container">


<section class="card">


<h2>
  창세기 말씀 관리
</h2>



<label for="chapter">
  창세기 장 선택
</label>


<select id="chapter">

</select>



<label for="bibleText">
  📖 말씀
</label>


<div class="hint">
  해당 장의 성경 말씀을 입력해 주세요.
</div>


<textarea
  id="bibleText"
  placeholder="말씀을 입력해 주세요."
></textarea>



<label for="pastorText">
  💬 목사님 설명
</label>


<div class="hint">
  해당 장에 대한 목사님의 설명을 입력해 주세요.
</div>


<textarea
  id="pastorText"
  placeholder="목사님 설명을 입력해 주세요."
></textarea>



<button
  id="saveBtn"
  class="save-btn"
>
  저장하기
</button>



<p
  id="status"
  class="status"
></p>


</section>


</main>



<script type="module">


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



/* Firebase */

const firebaseConfig = {

  apiKey:
    "AIzaSyCSDusP0m2Mbg2wNg7r6duA_T5stDH7YKU",

  authDomain:
    "manjong-genesis.firebaseapp.com",

  projectId:
    "manjong-genesis",

  storageBucket:
    "manjong-genesis.firebasestorage.app",

  messagingSenderId:
    "1017583422703",

  appId:
    "1:1017583422703:web:6c7d1ebec3850a8b92df1a"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* 화면 */

const chapter =
  document.getElementById("chapter");

const bibleText =
  document.getElementById("bibleText");

const pastorText =
  document.getElementById("pastorText");

const saveBtn =
  document.getElementById("saveBtn");

const status =
  document.getElementById("status");



/* 1~50장 */

for (
  let i = 1;
  i <= 50;
  i++
) {

  const option =
    document.createElement("option");

  option.value =
    i;

  option.textContent =
    "창세기 " + i + "장";

  chapter.appendChild(option);

}



/* 기존 내용 불러오기 */

async function loadChapter() {

  bibleText.value =
    "";

  pastorText.value =
    "";

  status.textContent =
    "";

  status.className =
    "status";


  try {

    const ref =
      doc(
        db,
        "pastorExplanations",
        String(chapter.value)
      );


    const snap =
      await getDoc(ref);


    if (snap.exists()) {

      const data =
        snap.data();


      bibleText.value =
        data.bibleText || "";


      pastorText.value =
        data.pastorText || "";

    }


  } catch (error) {

    status.className =
      "status error";

    status.textContent =
      "불러오기 실패\n"
      + error.code
      + "\n"
      + error.message;

  }

}



/* 장을 바꾸면 자동 불러오기 */

chapter.addEventListener(
  "change",
  loadChapter
);



/* 저장 */

saveBtn.addEventListener(
  "click",
  async () => {


    const bible =
      bibleText.value.trim();

    const pastor =
      pastorText.value.trim();


    if (
      !bible &&
      !pastor
    ) {

      status.className =
        "status error";

      status.textContent =
        "말씀이나 설명을 입력해 주세요.";

      return;

    }


    saveBtn.disabled =
      true;


    status.className =
      "status";

    status.textContent =
      "저장 중입니다...";


    try {


      await setDoc(

        doc(
          db,
          "pastorExplanations",
          String(chapter.value)
        ),

        {

          bibleText:
            bible,

          pastorText:
            pastor,

          updatedAt:
            serverTimestamp()

        }

      );


      status.className =
        "status success";


      status.textContent =
        "창세기 "
        + chapter.value
        + "장 내용이 저장되었습니다.";


    } catch (error) {


      status.className =
        "status error";


      status.textContent =
        "저장 실패\n"
        + error.code
        + "\n"
        + error.message;


    }


    saveBtn.disabled =
      false;

  }
);



/* 처음 실행 */

loadChapter();


</script>


</body>
</html>
