<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>만종감리교회 - 목사님 관리자</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f5ef;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:20px;
  line-height:1.7;
}

header{
  background:#5d6f52;
  color:white;
  text-align:center;
  padding:28px 18px;
}

h1{
  font-size:32px;
  margin:0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:25px 18px 60px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  margin:18px 0;
  box-shadow:0 2px 9px #0001;
}

label{
  display:block;
  font-weight:800;
  margin:15px 0 7px;
}

select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #bbb;
  border-radius:10px;
  font:inherit;
}

textarea{
  min-height:280px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 22px;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#5d6f52;
  color:white;
  margin-top:16px;
}

.status{
  margin-top:15px;
  font-weight:700;
}

.ok{
  color:#49623f;
}

.error{
  color:#a33;
  white-space:pre-wrap;
}
</style>

</head>


<body>

<header>
  <h1>
    만종감리교회<br>
    목사님 관리자
  </h1>
</header>


<main class="container">

<section class="card">

  <h2>창세기 설명 관리</h2>

  <label for="chapter">
    창세기 장 선택
  </label>

  <select id="chapter"></select>


  <label for="text">
    목사님 설명
  </label>

  <textarea
    id="text"
    placeholder="선택한 장의 설명을 입력해 주세요."
  ></textarea>


  <button
    id="saveBtn"
    class="primary"
  >
    저장하기
  </button>


  <p
    id="status"
    class="status"
  ></p>

</section>

</main>


<script type="module">

/* =========================
   Firebase
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* =========================
   Firebase 설정
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCSDusP0m2Mbg2wNg7r6duA_T5stDH7YKU",

  authDomain:
    "manjong-genesis.firebaseapp.com",

  projectId:
    "manjong-genesis",

  storageBucket:
    "manjong-genesis.firebasestorage.app",

  messagingSenderId:
    "1017583422703",

  appId:
    "1:1017583422703:web:6c7d1ebec3850a8b92df1a"

};


/* =========================
   Firebase 시작
========================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   화면 요소
========================= */

const chapter =
  document.getElementById("chapter");

const text =
  document.getElementById("text");

const status =
  document.getElementById("status");

const saveBtn =
  document.getElementById("saveBtn");


/* =========================
   1~50장 만들기
========================= */

for(let i = 1; i <= 50; i++){

  const option =
    document.createElement("option");

  option.value = i;

  option.textContent =
    "창세기 " + i + "장";

  chapter.appendChild(option);

}


/* =========================
   설명 불러오기
========================= */

async function loadText(){

  status.textContent = "";
  status.className = "status";

  text.value = "";


  try{

    const ref =
      doc(
        db,
        "pastorExplanations",
        String(chapter.value)
      );


    const snap =
      await getDoc(ref);


    if(snap.exists()){

      text.value =
        snap.data().text || "";

    }


  }catch(error){

    status.className =
      "status error";

    status.textContent =
      "불러오기 실패\n"
      + error.code
      + "\n"
      + error.message;

  }

}


/* =========================
   장 변경
========================= */

chapter.addEventListener(
  "change",
  loadText
);


/* =========================
   저장
========================= */

saveBtn.addEventListener(
  "click",
  async () => {

    const value =
      text.value.trim();


    if(!value){

      status.className =
        "status error";

      status.textContent =
        "설명을 입력해 주세요.";

      return;

    }


    saveBtn.disabled = true;

    status.className =
      "status";

    status.textContent =
      "저장 중입니다...";


    try{

      await setDoc(

        doc(
          db,
          "pastorExplanations",
          String(chapter.value)
        ),

        {
          text:value,
          updatedAt:serverTimestamp()
        }

      );


      status.className =
        "status ok";

      status.textContent =
        "창세기 "
        + chapter.value
        + "장 설명이 저장되었습니다.";


    }catch(error){

      status.className =
        "status error";

      status.textContent =
        "저장 실패\n"
        + error.code
        + "\n"
        + error.message;

    }


    saveBtn.disabled = false;

  }
);


/* =========================
   처음 화면
========================= */

loadText();

</script>

</body>
</html>
