<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 창세기 - 만종감리교회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #f7f5f0;
      color: #333;
    }

    header {
      background: #5b6f56;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 18px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 18px 50px;
    }

    .church-name {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .chapter-btn {
      border: none;
      border-radius: 12px;
      padding: 18px 5px;
      background: white;
      box-shadow: 0 2px 7px rgba(0,0,0,0.08);
      font-size: 18px;
      font-weight: bold;
      color: #4f624b;
      cursor: pointer;
    }

    .chapter-btn:active {
      transform: scale(0.97);
    }

    .chapter-page {
      display: none;
    }

    .back-btn {
      border: none;
      background: #e4e8df;
      color: #4f624b;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 17px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .chapter-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .section {
      background: white;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .section h2 {
      margin-top: 0;
      font-size: 23px;
      color: #52664d;
    }

    .bible-text {
      font-size: 19px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .pastor-text {
      font-size: 19px;
      line-height: 1.8;
      white-space: pre-line;
      min-height: 80px;
    }

    .loading {
      color: #777;
    }

    @media (max-width: 600px) {
      .chapter-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .chapter-btn {
        font-size: 16px;
        padding: 16px 3px;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>오늘의 창세기</h1>
  <p>시편 119편 105절</p>
</header>

<div class="container">

  <div id="homePage">
    <div class="church-name">만종감리교회</div>

    <div class="chapter-grid" id="chapterGrid"></div>
  </div>

  <div id="chapterPage" class="chapter-page">

    <button class="back-btn" onclick="goHome()">← 장 목록으로</button>

    <div class="chapter-title" id="chapterTitle"></div>

    <div class="section">
      <h2>📖 말씀 읽기</h2>
      <div class="bible-text">
        이곳에 해당 장의 성경 말씀을 넣어 주세요.
      </div>
    </div>

    <div class="section">
      <h2>💬 목사님 설명</h2>
      <div id="pastorText" class="pastor-text loading">
        목사님의 설명을 불러오는 중입니다.
      </div>
    </div>

  </div>

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyCSDusP0m2Mbg2wNg7r6rduA_T5stDH7YKU",
    authDomain: "manjong-genesis.firebaseapp.com",
    projectId: "manjong-genesis",
    storageBucket: "manjong-genesis.firebasestorage.app",
    messagingSenderId: "1017583422703",
    appId: "1:1017583422703:web:6c7d1ebec3850a8b92df1a"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  const chapterGrid = document.getElementById("chapterGrid");

  for (let i = 1; i <= 50; i++) {

    const button = document.createElement("button");

    button.className = "chapter-btn";
    button.textContent = `${i}장`;

    button.addEventListener("click", () => {
      openChapter(i);
    });

    chapterGrid.appendChild(button);
  }


  async function openChapter(chapter) {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("chapterPage").style.display = "block";

    document.getElementById("chapterTitle").textContent =
      `창세기 ${chapter}장`;

    const pastorText = document.getElementById("pastorText");

    pastorText.textContent = "목사님의 설명을 불러오는 중입니다.";
    pastorText.classList.add("loading");


    try {

      const explanationRef =
        doc(db, "pastorExplanations", String(chapter));

      const explanationSnap =
        await getDoc(explanationRef);


      if (explanationSnap.exists()) {

        const data = explanationSnap.data();

        if (data.text && data.text.trim() !== "") {
          pastorText.textContent = data.text;
        } else {
          pastorText.textContent =
            "아직 목사님의 설명이 등록되지 않았습니다.";
        }

      } else {

        pastorText.textContent =
          "아직 목사님의 설명이 등록되지 않았습니다.";

      }

    } catch (error) {

      console.error(error);

      pastorText.textContent =
        "설명을 불러오는 중 문제가 발생했습니다.";

    }

    pastorText.classList.remove("loading");
  }


  function goHome() {

    document.getElementById("chapterPage").style.display = "none";
    document.getElementById("homePage").style.display = "block";

  }

</script>

</body>
</html>
