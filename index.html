<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>만종감리교회 - 오늘의 창세기</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f5ef;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;

  font-size: 24px;
  line-height: 1.8;
}


/* 상단 */

header {
  background: #5d6f52;
  color: white;
  text-align: center;
  padding: 38px 20px 34px;
}

header h1 {
  margin: 0;
  font-size: 40px;
  line-height: 1.4;
}

header .verse {
  margin-top: 22px;
  font-size: 23px;
  line-height: 1.7;
}

header .reference {
  margin-top: 5px;
  font-size: 19px;
}


/* 전체 */

.container {
  max-width: 850px;
  margin: auto;
  padding: 32px 20px 60px;
}


/* 카드 */

.card {
  background: white;
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 25px;
  box-shadow: 0 2px 10px #0001;
}


/* 창세기 읽기 */

.list-title {
  font-size: 30px;
  font-weight: 900;
  text-align: center;
  margin-top: 0;
  margin-bottom: 25px;
}


/* 장 목록 */

#chapterList {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 13px;
}

.chapter-btn {
  background: #e7eadf;
  border: none;
  border-radius: 13px;

  padding: 17px 7px;

  font-size: 23px;
  font-weight: 900;

  color: #222;

  cursor: pointer;
}

.chapter-btn:hover {
  background: #d9dfcf;
}


/* 읽기 화면 */

#reading {
  display: none;
}


/* 돌아가기 */

.back-btn {
  background: #e5e5e5;
  border: none;
  border-radius: 13px;

  padding: 15px 21px;
  margin-bottom: 25px;

  font-size: 22px;
  font-weight: 900;

  cursor: pointer;
}


/* 장 제목 */

.chapter-title {
  font-size: 36px;
  font-weight: 900;
  margin-bottom: 25px;
}


/* 설명 제목 */

.section-title {
  font-size: 29px;
  font-weight: 900;
  margin-bottom: 18px;
}


/* 목사님 설명 */

.content {
  white-space: pre-wrap;

  font-size: 25px;

  line-height: 2;

  word-break: keep-all;
}


/* 설명이 없을 때 */

.empty {
  color: #777;
}


/* 모바일 */

@media (max-width: 600px) {

  body {
    font-size: 22px;
  }

  header {
    padding: 32px 16px;
  }

  header h1 {
    font-size: 34px;
  }

  header .verse {
    font-size: 21px;
  }

  header .reference {
    font-size: 18px;
  }

  .container {
    padding: 20px 14px 50px;
  }

  .card {
    padding: 22px;
  }

  #chapterList {
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .chapter-btn {
    font-size: 21px;
    padding: 15px 4px;
  }

  .chapter-title {
    font-size: 31px;
  }

  .section-title {
    font-size: 26px;
  }

  .content {
    font-size: 23px;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    만종감리교회<br>
    오늘의 창세기
  </h1>

  <div class="verse">
    “주의 말씀은 내 발에 등이요<br>
    내 길에 빛이니이다.”
  </div>

  <div class="reference">
    시편 119편 105절
  </div>

</header>



<main class="container">


<!-- 장 목록 -->

<section
  id="list"
  class="card"
>

  <h2 class="list-title">
    창세기 읽기
  </h2>

  <div id="chapterList"></div>

</section>



<!-- 장 내용 -->

<section id="reading">


  <button
    class="back-btn"
    id="backBtn"
  >
    ← 장 목록으로
  </button>


  <div class="card">

    <div
      id="chapterTitle"
      class="chapter-title"
    ></div>


    <div class="section-title">
      💬 목사님 설명
    </div>


    <div
      id="pastorText"
      class="content"
    >
      <span class="empty">
        아직 목사님 설명이 입력되지 않았습니다.
      </span>
    </div>

  </div>


</section>


</main>



<script type="module">


import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";


import {
  getFirestore,
  doc,
  getDoc
}
from
"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";



/* Firebase */

const firebaseConfig = {

  apiKey:
    "AIzaSyCSDusP0m2Mbg2wNg7r6duA_T5stDH7YKU",

  authDomain:
    "manjong-genesis.firebaseapp.com",

  projectId:
    "manjong-genesis",

  storageBucket:
    "manjong-genesis.firebasestorage.app",

  messagingSenderId:
    "1017583422703",

  appId:
    "1:1017583422703:web:6c7d1ebec3850a8b92df1a"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* 화면 */

const list =
  document.getElementById("list");

const reading =
  document.getElementById("reading");

const chapterList =
  document.getElementById("chapterList");

const chapterTitle =
  document.getElementById("chapterTitle");

const pastorText =
  document.getElementById("pastorText");

const backBtn =
  document.getElementById("backBtn");



/* 창세기 1~50장 */

for (
  let i = 1;
  i <= 50;
  i++
) {

  const button =
    document.createElement("button");

  button.className =
    "chapter-btn";

  button.textContent =
    i + "장";

  button.addEventListener(
    "click",
    () => openChapter(i)
  );

  chapterList.appendChild(button);

}



/* 장 열기 */

async function openChapter(chapter) {

  list.style.display =
    "none";

  reading.style.display =
    "block";


  chapterTitle.textContent =
    "창세기 " + chapter + "장";


  pastorText.innerHTML =
    '<span class="empty">불러오는 중...</span>';


  window.scrollTo(
    0,
    0
  );


  try {

    const ref =
      doc(
        db,
        "pastorExplanations",
        String(chapter)
      );


    const snap =
      await getDoc(ref);


    if (
      snap.exists()
    ) {

      const data =
        snap.data();


      if (
        data.pastorText
      ) {

        pastorText.textContent =
          data.pastorText;

      } else {

        pastorText.innerHTML =
          '<span class="empty">아직 목사님 설명이 입력되지 않았습니다.</span>';

      }


    } else {

      pastorText.innerHTML =
        '<span class="empty">아직 목사님 설명이 입력되지 않았습니다.</span>';

    }


  } catch (error) {

    pastorText.innerHTML =
      '<span class="empty">설명을 불러오지 못했습니다.</span>';

    console.error(error);

  }

}



/* 장 목록으로 돌아가기 */

backBtn.addEventListener(
  "click",
  () => {

    reading.style.display =
      "none";

    list.style.display =
      "block";


    window.scrollTo(
      0,
      0
    );

  }
);


</script>


</body>

</html>
